# Lint, unit + parity tests and the production build on every push to main and every PR.
# Vercel's deploy only runs `tsc -b && vite build`, so without this a failing test or lint
# error would still ship.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
